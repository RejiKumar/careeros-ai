name: EAS Android Build (Production AAB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: EAS build (Android production AAB)
        run: npx eas-cli build --platform android --profile production --non-interactive --no-wait
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: 49fb8f3d-8cde-4870-b988-14f3b707a47c

      - name: Show EAS build URL
        run: |
          echo "Build triggered. Find the latest build + AAB download link at:"
          echo "https://expo.dev/accounts/reji_rark/projects/careeros-ai/builds"
          echo "Download the .aab artifact and upload it to Play Console manually."
