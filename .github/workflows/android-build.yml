name: Android Build (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "production"
        type: choice
        options:
          - production
  push:
    branches: [prod]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android (${{ inputs.profile || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build on EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: 49fb8f3d-8cde-4870-b988-14f3b707a47c
        run: |
          PROFILE="${{ inputs.profile || 'production' }}"
          echo "Starting EAS build for profile: $PROFILE"
          BUILD_OUTPUT=$(eas build --profile "$PROFILE" --platform android --non-interactive --json)
          echo "$BUILD_OUTPUT"
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.id')
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Build started: https://expo.dev/accounts/reji_rark/projects/careeros-ai/builds/$BUILD_ID"

      - name: Wait for build to finish
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: 49fb8f3d-8cde-4870-b988-14f3b707a47c
        run: |
          echo "Waiting for build $BUILD_ID..."
          while true; do
            STATUS=$(eas build:view "$BUILD_ID" --json | jq -r '.status')
            echo "Status: $STATUS"
            case "$STATUS" in
              finished)
                echo "Build completed successfully"
                break
                ;;
              errored)
                echo "Build failed"
                exit 1
                ;;
              *)
                sleep 60
                ;;
            esac
          done

      - name: Summary
        run: |
          echo "## Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Profile:** ${{ inputs.profile || 'production' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build:** https://expo.dev/accounts/reji_rark/projects/careeros-ai/builds/$BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
