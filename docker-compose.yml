services:
  api:
    build:
      context: ./apps/api
    container_name: careeros-api
    ports:
      - "8000:8000"
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      - CAREEROS_ENVIRONMENT=dev
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: careeros-postgres
    environment:
      - POSTGRES_USER=careeros
      - POSTGRES_PASSWORD=careeros
      - POSTGRES_DB=careeros
    ports:
      - "5432:5432"
    volumes:
      - careeros-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeros -d careeros"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  careeros-pgdata:
